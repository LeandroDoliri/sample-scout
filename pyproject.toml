[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-scout"
version = "0.1.0"
description = "Librería de samples que se analiza y ordena sola, con arrastre directo a Ableton."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
sample-scout = "sample_scout.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
