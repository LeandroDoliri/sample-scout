[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-scout"
dynamic = ["version"]  # sale del archivo VERSION, como la app y el instalador
description = "Librería de samples que se analiza y ordena sola, con arrastre directo a Ableton."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8",
    "PySide6-Addons>=6.8",  # QtMultimedia (preescucha); sin QtWebEngine ni QtPdf
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "pillow"]  # pillow: tools/make_icon.py

[project.gui-scripts]
sample-scout = "sample_scout.app:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
